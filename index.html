                services: "خدماتنا",

                cta: "احجز موعدك الآن",

                servicesTitle: "خدماتنا الاحترافية",

                        muted: true,
                        loop: true,
                        playsInline: true,
                        className: 'video-bg'
                    },

                    ),
                    React.createElement('div', { className: 'absolute inset-0 bg-slate-950/75 z-[1]' }),
                    React.createElement(motion.div, {
                        initial: { opacity: 0, y: 20 },
                        animate: { opacity: 1, y: 0 },
                        transition: { duration: 0.6, delay: 0.1 },
                        className: 'relative z-10 max-w-2xl mx-auto px-6'
                    },
                        React.createElement('span', { className: 'bg-primary/20 border border-primary/50 text-primary px-3 py-1 rounded-full text-xs font-bold inline-block mb-3' }, t.tagline),
                        React.createElement('h1', { className: 'text-2xl md:text-4xl font-black text-white mb-3 leading-tight' }, t.heroTitle),

                            }, t.services),

                        React.createElement('form', {
                            onSubmit: (e) => { e.preventDefault(); alert(lang === 'ar' ? 'تم إرسال طلبك بنجاح! سنتواصل معك قريباً.' : 'Request sent successfully! We will contact you soon.'); },
                            className: 'bg-slate-800/50 border border-slate-700 p-8 md:p-12 rounded-3xl backdrop-blur-sm grid grid-cols-1 md:grid-cols-2 gap-6 text-right'
                        },
                            React.createElement('div', null,
                                React.createElement('label', { className: 'block text-slate-300 font-semibold mb-2 text-sm' }, t.namePlaceholder),
                                React.createElement('input', {
                                    type: 'text',
                                    required: true,
                                    placeholder: t.namePlaceholder,
                                    className: 'w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primary transition-all'

                    )
                )

        const root = document.getElementById('root');
        ReactDOM.createRoot(root).render(React.createElement(App));
        
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 100);

</body>
